name: Deploy to Google Apps Script

on:
  push:
    branches: [main]
    paths: ['gas/**', '.github/workflows/deploy-gas.yml']
  workflow_dispatch:

concurrency:
  group: deploy-gas
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @google/clasp
      - name: Configure clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
        run: |
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"gas"}' "$GAS_SCRIPT_ID" > .clasp.json
      - name: Push code
        run: clasp push --force
      - name: Update web app deployment (URL stays the same)
        env:
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
        run: clasp deploy --deploymentId "$GAS_DEPLOYMENT_ID" --description "${GITHUB_SHA::7}"
      # clasp がトークンを更新した場合に備え、Secret を更新したい場合は別途対応
